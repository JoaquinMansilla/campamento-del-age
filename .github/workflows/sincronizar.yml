name: Sincronizar partidas

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sincronizar.mjs
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      - name: Guardar catálogo si aprendió algo nuevo
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Catálogo sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar catálogo de civilizaciones y mapas"
          git push
